<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0a0b">
<title>Sumo Bounce</title>
<style>
/* Anton (Google Fonts, SIL OFL 1.1) — latin 서브셋만 self-host(18.6KB, 외부 요청 0). 숫자·영문·VS·READY 만
   디스플레이체, 한글은 unicode-range 밖이라 시스템 한글 서체로 폴백된다. */
@font-face{font-family:"Anton";font-style:normal;font-weight:400;font-display:swap;
  src:url(./fonts/anton-400-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  /* 그래픽 고도화(2026-08-30) 팔레트 규율 — DESIGN.md §2. 변수 «이름»은 기존 규칙이 참조하므로 그대로 두고
     «값»만 3색+먹 체계로: 먹(따뜻한 검정)·등롱 금·주홍(P1)·남색(P2). ok(초록)→남색, vio(보라)→등롱 금 틴트. */
  --bg:#0e0a0b; --bg2:#130d0f; --card:#181113; --card2:#241a1d; --line:rgba(255,236,214,.09);
  --txt:#f6efe6; --dim:#c2b5a8; --dim2:#a89a8c;
  --red:#ff5a5f; --blue:#4a9eff; --gold:#ffc94a; --gold2:#ff9d2e; --ok:#4a9eff; --vio:#ffdd8a; --ink-on-gold:#241703;
  --display:"Anton","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --r-s:12px; --r-m:18px; --r-l:26px;
  --ez:cubic-bezier(.16,1,.3,1);
  /* 트랙K(2026-08-05) Partner 실행승인 — 안전영역 상단 클램프. 불투명 네비바
     (insets.top 59 + navbar 44 = 103css 검은 띠)에 웹뷰 --sa-top 59css 가
     또 비워져 162css 이중 계상 — "헤드가 길게 빈다"의 실체. SDK(src/toss/
     safeArea.ts)가 --sa-top 을 documentElement 에 «인라인»으로 꽂으므로
     !important 없이는 이 클램프가 무효(인라인이 :root 선언보다 특정도가
     높다) — 반드시 !important 유지.
     ★ !important 는 «상단만»이다. 회전·폴더블로 상단 인셋이 바뀌어도 12
     고정인데, 검은 띠가 이미 노치를 덮고 있으므로 그게 맞는 동작이다.
     ★ 나중에 transparentBackground:true 로 가면 웹뷰가 띠 밑까지 올라오
     므로 이 !important 를 걷어내고 «실제 인셋»을 써야 한다. */
  --sa-top:12px !important;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI','Helvetica Neue',Arial,'Noto Sans JP',sans-serif;
  font-synthesis:none;
  touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
body{font-feature-settings:"tnum";}
::selection{background:rgba(255,201,74,.35);color:var(--txt)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0}

/* ---------- stage / canvas (full-bleed, HUD floats on top) ---------- */
#stage{position:absolute;inset:0;display:block}
#game-container{position:absolute;inset:0}
canvas#gameCanvas{width:100%;height:100%;display:block;background:var(--bg)}
/* 2P zones are split TOP/BOTTOM (phone laid flat between two players facing
   each other). The ids stay #touch-left / #touch-right on purpose: they are
   referenced by indicatorFor() and renaming them buys nothing but diff.
   Read them as "P1 zone" / "P2 zone".  P1 = red = BOTTOM, P2 = blue = TOP. */
.touch-indicator{position:absolute;left:0;width:100%;height:50%;pointer-events:none;opacity:0;
  transition:opacity .14s ease;z-index:2;border-radius:6px}
#touch-left{bottom:0;background:linear-gradient(to top,rgba(255,90,95,.14),transparent 65%)}
#touch-right{top:0;background:linear-gradient(to bottom,rgba(74,158,255,.14),transparent 65%)}
#touch-solo{top:0;height:100%;background:radial-gradient(circle at 50% 70%,rgba(255,201,74,.10),transparent 62%)}
.touching{opacity:1}
/* In 2P the zones are shown ALWAYS, not only while a finger is down, so a
   player can see which half is theirs before they ever touch it. Faint enough
   not to fight the ring; the press still brightens it to full. */
/* 2026-08-14 트랙③ 재작업 — President 「이거 2P에서 뜨는 띠가 뭐야?」
   ★규율 15: 사용자가 «이게 뭐냐»고 물으면 그 표시는 «실패»다.
   ★규율 16: 참고앱(Red Hands)은 「반쪽 «배경색»」인데 우리는 「가장자리→캐릭터
     «관통선»」으로 옮겼다 — «형태»가 달라지자 링을 가로지르는 부작용이 났다.
   → 귀속 표현을 «배경 틴트 하나»로 되돌리고 세기를 올린다(.55 -> .92).
     틴트는 화면 «가장자리»에서 가장 진하고 65% 지점에서 투명해지므로
     ★링 위에는 거의 얹히지 않는다 — "링 밖에서만 보인다"는 요구와 맞는다. */
#game-container.duo #touch-left,
#game-container.duo #touch-right{opacity:.92}
#game-container.duo #touch-left.touching,
#game-container.duo #touch-right.touching{opacity:1}
/* ⛔경계 실선(::after)은 «제거»했다. 두 가지 이유 모두 실측이다:
   ① [Partner 실기기 판독] 2px·white 17% 는 «안 보인다». 「안 보이는 건 없는 것과
      같다 — 세기를 올리거나 빼라. 어중간하게 두지 마라」
   ② 세기를 올리면 ★링을 «가로지른다» — 링 좌우 여백이 31.5px(390폭 기준)뿐이라
      「링 밖에서만 보이는 가로선」은 «기하학적으로 불가능»하다.
   → 올릴 수도, 유지할 수도 없으므로 «뺀다». 귀속은 틴트+발밑링+셰브론이 담당한다. */

/* ---------- HUD ---------- */
#hud{position:absolute;z-index:6;left:0;right:0;margin:0 auto;
  top:calc(6px + var(--sa-top, env(safe-area-inset-top)));display:flex;align-items:center;gap:10px;padding:6px 12px;
  opacity:0;transform:translateY(-8px);transition:opacity .3s var(--ez),transform .3s var(--ez);pointer-events:none}
/* MEASURED: the HUD box is the full width x ~63px. While it was pointer-events
   auto it swallowed every press inside that band (its touchstart handler calls
   stopPropagation, so the window listener never fired). Harmless when the split
   was left/right - it was dead for both players alike - but with a TOP/BOTTOM
   split that band sits entirely inside the TOP player's zone and cost them
   ~15% of their own area, right where a thumb rests. The HUD is display-only;
   #btn-pause is its one interactive child, so only that opts back in. */
#hud.on{opacity:1;transform:none;pointer-events:none}
#hud.on #btn-pause{pointer-events:auto}
/* ★2P 정보 «소유자 쪽» 배치 (2026-08-14 재작업 2차).
   ⛔1차 실패 기록 — 이 자리에 «죽은 규칙» 6개를 넣었다:
     선택자를 #hud.duo / #footbar.duo 로 썼는데 duo 클래스는 #game-container 와
     #sc-result 에만 붙었다. #hud·#footbar 에는 «한 번도» 안 붙어 전량 무효였다.
     그 결과 HUD 가 한 줄에 [mid][side2][pause][gauge2] 를 욱여넣어
     ① 일시정지가 P2 정보 한가운데 끼고 ② 타이머가 왼쪽으로 밀리고
     ③ 이름이 플레이어당 두 번 나왔다 — President 가 본 증상 전부.
   ★선택자를 «고치는» 길은 없다: #hud 는 #game-container 의 «자손이 아니다»
     (#app > #hud / #app > #stage > #game-container). 그래서 #game-container.duo #hud
     는 «영원히» 매치되지 않는다. → layoutDuo() 가 #hud·#footbar 에 «직접» 붙인다.
   ⛔pointer-events 는 건드리지 않는다. HUD 터치 흡수 제거는 ①레인 성과다. */
/* ★grid 로 간다. flex-wrap 으로는 「가운데 정렬된 mid」와 「오른쪽 끝 pause」를
   동시에 만들 수 없다(side1 이 빠져나가 좌우 균형이 깨진다).
   1fr auto 1fr 이면 mid 가 «항상» 화면 정중앙이다 — 타이머 중앙 복귀. */
#hud.duo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  column-gap:10px;row-gap:3px}
#hud.duo #hud-side2{grid-column:1;grid-row:1;align-items:flex-start}
#hud.duo .hud-mid{grid-column:2;grid-row:1}
/* ★일시정지 = 어느 쪽에도 안 속한 «중립» 자리. 정중앙 mid 가 P2 정보(1열)와
   pause(3열) 사이를 갈라줘서 더는 P2 정보에 «끼어» 보이지 않는다. */
#hud.duo #btn-pause{grid-column:3;grid-row:1;justify-self:end}
#hud.duo #gauge2{grid-column:1/-1;grid-row:2;min-width:0}
#footbar.duo{display:grid;grid-template-columns:1fr;row-gap:3px}
#footbar.duo #hud-side1{grid-row:1;min-width:0}
#footbar.duo #gauge1{grid-row:2;min-width:0}
/* ★회전 «범위 변경»: 글자만 돌리면 블록의 좌우 배치는 그대로라 위쪽 플레이어에겐
   여전히 어긋나 보인다. → P2 «블록 전체»를 돌린다. 핍·게이지는 좌우 대칭 도형이라
   블록째 돌아가면 채워지는 방향이 P1(아래) 과 «같은 방향»으로 읽힌다. */
#hud.duo #hud-side2,
#hud.duo #gauge2{transform:rotate(180deg)}
#hud::before{content:"";position:absolute;left:0;right:0;top:calc(-6px - var(--sa-top, env(safe-area-inset-top)));bottom:-26px;
  background:linear-gradient(180deg,rgba(14,10,11,.88) 30%,rgba(14,10,11,0));pointer-events:none;z-index:-1}
#footbar::before{content:"";position:absolute;left:0;right:0;top:-24px;bottom:calc(-8px - var(--sa-bottom, env(safe-area-inset-bottom)));
  background:linear-gradient(0deg,rgba(14,10,11,.88) 34%,rgba(14,10,11,0));pointer-events:none;z-index:-1}
.hud-side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px}
.hud-side.rt{align-items:flex-end}
.hud-name{font-size:.8rem;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%}
.hud-name.p1{color:var(--red)} .hud-name.p2{color:var(--blue)}
/* 2026-08-22 AI티 S8 — 2P 모드에서 "누구 소유 화면인지"를 텍스트 유니코드
   ▲/▼(U+25B2/25BC, game.js 가 textContent 에 직접 이어붙였다)로 나타내던 것을
   순수 CSS 삼각형(border-trick)으로 교체. 폰트별 렌더 편차·「유니코드 기호를
   아이콘 대용으로 쓴다」는 AI 티를 없애고, 결과는 픽셀 단위로 동일하다
   (같은 위치·같은 방향·currentColor 로 p1/p2 색 자동 상속). zero-dependency 유지.
   ⛔순서 바뀌면 안 됨: P1=화면 «아래»(▼, ::before) / P2=화면 «위»(▲, ::after) —
   game.js syncHUD() 의 기존 극성과 «반드시» 일치해야 한다(안 그러면 방향이 반대로 보임). */
/* ★실측 정정 — P1(hud-name1)은 duo 모드에서 «#hud 가 아니라 #footbar»의
   자손이다(layoutDuo() 가 hud-side1 을 footbar 로 옮긴다, 84행 주석의 같은
   함정을 headless DOM 조회로 재확인). #hud.duo 로 걸면 이 규칙이 «영원히»
   매치되지 않는다 — #footbar.duo 로 걸어야 한다. */
#footbar.duo .hud-name.p1::before{content:'';display:inline-block;width:0;height:0;
  margin-right:4px;vertical-align:1px;
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:6px solid currentColor}
#hud.duo .hud-name.p2::after{content:'';display:inline-block;width:0;height:0;
  margin-left:4px;vertical-align:1px;
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-bottom:6px solid currentColor}
.hud-tag{font-size:.7rem;font-weight:700;color:var(--dim2);letter-spacing:.02em}
.pips{display:flex;gap:5px}
.pip{width:15px;height:6px;border-radius:3px;background:rgba(255,236,214,.13);transition:all .28s var(--ez)}
.pip.on{animation:pipPop .34s var(--ez)}
.pip.on.p1{background:var(--red)}
.pip.on.p2{background:var(--blue)}
@keyframes pipPop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.hud-mid{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:126px}
.hud-round{font-family:var(--display);font-size:.8rem;font-weight:400;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.hud-timer{width:126px;height:4px;border-radius:2px;background:rgba(255,236,214,.10);overflow:hidden}
.hud-timer i{display:block;height:100%;width:100%;border-radius:2px;background:var(--gold);transition:background .4s ease}
.hud-timer i.warn{background:var(--red);animation:timerPulse .9s ease-in-out infinite}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.55}}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:.7rem;font-weight:800;letter-spacing:.02em;background:rgba(255,236,214,.06);
  border:1px solid var(--line);color:var(--dim);white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:0 0 auto}
.chip.hot{color:#ffe9a8;border-color:rgba(255,201,74,.4);background:rgba(255,201,74,.10)}
/* 44x44 minimum: platform touch-target rule (pause is the only in-match HUD control) */
.icon-btn{flex:0 0 auto;width:44px;height:44px;min-width:44px;min-height:44px;border-radius:13px;
  background:rgba(255,236,214,.06);
  border:1px solid var(--line);color:var(--dim);font-size:1rem;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .18s var(--ez)}
.icon-btn:hover{background:rgba(255,236,214,.13);color:var(--txt)}
.icon-btn:active{transform:scale(.92)}

/* ---------- foot gauges ---------- */
#footbar{position:absolute;z-index:6;left:0;right:0;margin:0 auto;
  bottom:calc(8px + var(--sa-bottom, env(safe-area-inset-bottom)));display:flex;gap:12px;padding:0 14px;
  opacity:0;transition:opacity .3s var(--ez);pointer-events:none}
#footbar.on{opacity:1}
.gauge{flex:1 1 0;min-width:0}
.gauge b{display:block;font-size:.7rem;font-weight:700;letter-spacing:.03em;color:var(--dim2);
  margin-bottom:4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge.rt b{text-align:right}
.gauge-track{height:7px;border-radius:4px;background:rgba(255,236,214,.08);overflow:hidden;display:flex}
.gauge.rt .gauge-track{justify-content:flex-end}
.gauge-track i{display:block;height:100%;width:0%;border-radius:4px}
.gauge.p1 .gauge-track i{background:linear-gradient(90deg,#ff5a5f,#ffc94a)}
.gauge.p2 .gauge-track i{background:linear-gradient(270deg,#4a9eff,#9fd0ff)}
.gauge.full .gauge-track i{filter:brightness(1.3) saturate(1.1)}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  /* top pad clears the fixed language/sound layer (44px tall buttons + 8px inset) */
  padding:calc(58px + var(--sa-top, env(safe-area-inset-top))) 16px calc(20px + var(--sa-bottom, env(safe-area-inset-bottom)));
  scroll-padding-bottom:var(--ctaPad,96px);
  word-break:keep-all;overflow-wrap:break-word;
  background:radial-gradient(125% 62% at 50% -6%, #2a1518 0%, #150d0f 46%, #0e0a0b 100%);
  transition:opacity .34s var(--ez),transform .34s var(--ez);opacity:1}
/* 트랙B(2026-08-05) 두 번째 근본원인(콘텐츠가 뷰포트보다 «긴» 화면 —
   2인대전 선수선택처럼 스크롤이 실제로 필요한 경우): position:sticky;bottom:0
   은 가장 가까운 스크롤 조상(.screen)의 «패딩 박스» 기준으로 붙는다.
   .screen 의 padding-bottom(20px+safe-bottom, 위 92행)이 있는 채로는 CTA 바가
   진짜 화면 바닥보다 20~54px(세이프에어리어 포함 실기기) 위에서 멈추고, 그
   틈으로 스크롤되어 지나간 리스트(규칙 설명 등)가 그대로 비쳐 보인다 —
   "버튼 아래로 목록이 계속 이어진다"는 President 관측과 정확히 일치
   (실측: sc-select 2인대전, 390x844, sticky-cta.bottom=824=viewport(844)-
   screen.padding-bottom(20). 강제로 padding-bottom:0 을 주면 즉시 844로
   붙는 것도 실측 확인). safe-area 여백은 .sticky-cta 자신의 padding
   calc(9px+safe-bottom)(151행)이 이미 담당하므로 .screen 쪽 padding-bottom
   은 CTA 가 있는 화면에선 필요 없다 — 오히려 이중 계상되어 틈을 만들었다.
   CTA 가 없는 화면(타이틀/도움말/일시정지)은 원래 의도대로 유지한다. */
#sc-select,#sc-vs,#sc-result{padding-bottom:0}
.screen.glass{background:linear-gradient(180deg,rgba(12,7,8,.80),rgba(12,7,8,.95))}
.screen.hidden{opacity:0;pointer-events:none;transform:translateY(14px)}
/* 트랙B(2026-08-05) 근본원인: 이 규칙(margin:auto 0)이 .panel 전체를 .screen
   안에서 수직 중앙정렬시켰다. .sticky-cta 는 .screen 이 아니라 .panel 의
   자식이라 sticky 의 containing block 은 .panel 이고, 콘텐츠가 뷰포트보다
   짧으면(특히 2인대전 VS 화면 — 사다리 목록이 숨겨져 콘텐츠가 가장 짧다)
   .panel 이 화면 세로 중앙에 뜨고 마지막 자식인 CTA 바가 그 바닥, 즉 화면
   중간에 멈춘다 — "승부! 버튼이 공중에 떠 있다" 의 기하학적 원인
   (DOM 실측: sc-vs 390x844 에서 panel margin-top/bottom 234.9px, CTA 아래
   빈 여백 254.9px — B_root_cause_matrix.json 참고). 그림자만 키운 지난
   수정(게이트4, 2026-08-03)은 원인을 안 건드려 재발했다.
   해법: 기본은 중앙정렬을 없애 콘텐츠를 화면 상단에 고정한다(.sticky-cta
   가 없는 화면은 아래 .panel.center-mid 로 개별 복원 — 타이틀/도움말/일시정지
   는 원래도 모달처럼 중앙에 뜨는 게 의도였고 버그 리포트 대상이 아니다).
   CTA가 있는 화면(선택/VS/결과)은 .sticky-cta 자신의 margin-top:auto 가
   패널의 남는 세로공간을 흡수해 바를 화면 "바닥"에 붙인다 — 콘텐츠가
   짧을 때도 버튼이 화면 최하단에 있어 "공중에 뜬" 것처럼 보이지 않는다.
   콘텐츠가 넘치면 기존처럼 정상 스크롤+sticky 동작(회귀 없음, 실측 확인).
   ★ flex:1 1 auto 가 필요한 이유: .panel 은 기존엔 콘텐츠 높이만큼만 차지했다
   (margin:auto 0 가 .screen 의 남는 공간을 밖에서 흡수했었다). 이제 .panel
   자신이 .screen 의 남는 세로공간을 다 차지해야 그 안의 .sticky-cta 가
   margin-top:auto 로 바닥까지 밀릴 여지가 생긴다.
   ★★ [실측 정정] .panel.center-mid 는 flex-grow:1 을 함께 두면 안 된다 —
   스펙상 flex-grow 가 남는 공간을 먼저 "박스 크기"로 흡수해버려서, 그 뒤
   auto margin 은 분배할 공간이 0으로 남아 무력화된다(직접 실측: flex:1
   유지한 채 margin:auto 0 만 얹었더니 sc-pause 도 margin 0px/0px 로 나와
   중앙정렬이 깨졌다). 그래서 .center-mid 는 flex-grow 를 0으로 꺼서
   "콘텐츠 높이만큼만 차지 + margin:auto 0 로 중앙정렬"이라는 원래 동작으로
   되돌린다. */
.panel{width:100%;max-width:600px;margin:0;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.panel.wide{max-width:760px}
/* 위 주석 참고 — 콘텐츠가 짧아도 모달처럼 중앙에 떠야 하는 화면(CTA 바 없음:
   타이틀/도움말/일시정지)만 여기서 개별 복원한다. flex-grow 를 꺼야
   margin:auto 0 가 실제로 여유공간을 흡수한다(위 실측 정정 참고). */
.panel.center-mid{flex:0 1 auto;margin:auto 0}

/* logo */
.logo{text-align:center;margin-top:6px}
.logo .mark{display:inline-flex;align-items:center;justify-content:center;gap:10px}
.logo .ring{width:46px;height:46px;border-radius:50%;border:5px solid var(--gold);
  box-shadow:0 10px 20px -8px rgba(0,0,0,.7);position:relative;background:#1c1214;
  animation:ringpulse 3s var(--ez) infinite}
.logo .ring::after{content:"";position:absolute;inset:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--red) 0 48%,var(--blue) 52% 100%)}
@keyframes ringpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* 단색 잉크 + 주홍 오프셋 그림자(흥행 포스터 글자) — 그라데이션 텍스트·제로오프셋 헤일로는 AI 티(검출기 기준) */
h1.title{font-family:var(--display);font-size:2.5rem;font-weight:800;letter-spacing:.01em;line-height:1;
  color:var(--txt);text-shadow:0 4px 0 #a52a2c,0 12px 24px rgba(0,0,0,.55)}
.tagline{font-size:1rem;color:var(--dim);margin-top:8px;line-height:1.5}
.tagline b{color:var(--gold);font-weight:800}

h2.sc-title{font-size:1.5rem;font-size:clamp(1.25rem,5vw,1.7rem);font-weight:800;letter-spacing:-.01em;text-align:center}
.sc-sub{font-size:.875rem;color:var(--dim);text-align:center;line-height:1.55;margin-top:-4px}
.eyebrow{font-size:.875rem;font-weight:700;letter-spacing:0;color:var(--dim);text-transform:none}
#sc-select .panel>div:first-child,#sc-result .panel>div:first-child{display:flex;flex-direction:column;align-items:center;gap:6px}
#sc-select .panel>div:first-child .eyebrow,#sc-result .panel>div:first-child .eyebrow{order:2}
#sc-select .panel>div:first-child .sc-title{order:1;margin-top:0!important}
#sc-result .panel>div:first-child .bigres{order:1}
#sc-result .panel>div:first-child .sc-sub{order:3;margin-top:2px!important}
#vs-eyebrow{font-size:1rem;font-weight:800;color:var(--txt)}

/* buttons */
.btn{width:100%;min-height:52px;border-radius:var(--r-m);border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-size:1rem;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;padding:12px 18px;
  transition:transform .16s var(--ez),background .2s ease,border-color .2s ease,box-shadow .2s ease;
  font-family:inherit}
.btn:hover{background:var(--card2);border-color:rgba(255,236,214,.2)}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(170deg,#ffd35c,#ffb42e);color:var(--ink-on-gold);border-color:transparent;
  box-shadow:0 10px 22px -8px rgba(0,0,0,.65),0 1px 0 rgba(255,236,214,.35) inset}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 14px 26px -8px rgba(0,0,0,.7),0 1px 0 rgba(255,236,214,.35) inset}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--txt);background:rgba(255,236,214,.05)}
.btn.sm{min-height:44px;font-size:.875rem;border-radius:var(--r-s)}
.btn-row{display:flex;gap:10px;width:100%}
/* Keeps the primary action reachable on 640px-tall viewports without hunting for it.
   The bar is FULLY OPAQUE so nothing underneath ever looks tappable, and .cta-pad
   below reserves exactly the bar's height inside the scroller so every list row can
   be scrolled clear of it.
   트랙B(2026-08-05): margin-top:2px(고정) → auto. .panel 이 더는 자신을
   중앙정렬하지 않으므로(위 .panel 주석 참고), 콘텐츠가 짧아 남는 세로
   공간이 있으면 이 auto 마진이 그 공간을 통째로 흡수해 바를 패널의
   "바닥"(=화면 바닥, safe-area 패딩 안쪽)에 붙인다. 콘텐츠가 넘칠 때는
   여유 공간이 없어 기존과 동일하게(사실상 0px) 동작 — 실측 회귀 없음. */
.sticky-cta{position:sticky;bottom:0;z-index:5;padding:13px 0 calc(9px + var(--sa-bottom, env(safe-area-inset-bottom)));
  margin-top:auto;background:var(--bg);box-shadow:0 -16px 20px -8px var(--bg),0 -1px 0 rgba(255,236,214,.05)}
.screen.glass .sticky-cta{background:#0b0708;
  /* 트랙K 게이트4(2026-08-03): "승부! 버튼이 공중에 떠 보인다" 지적 — 배경은
     이미 완전 불투명(#090c12)이었다(확인). 경계를 더 뚜렷이 하려고 위쪽 그림자를
     더 진하고 넓게 키웠다(투명 그라디언트로 만들면 오히려 바 상단이 비쳐 보일
     위험이 있어 배경은 그대로 solid 유지, 그림자만 강화). */
  box-shadow:0 -22px 26px -6px #0b0708,0 -1px 0 rgba(255,236,214,.08)}
/* scroll runway underneath the sticky bar - height is set from the measured bar */
.cta-pad{width:100%;flex:0 0 auto;height:0;pointer-events:none}
/* "there is more below" cue, shown only while the screen can still scroll down */
.sticky-cta::before,.sticky-cta::after{content:"";position:absolute;display:none;pointer-events:none}
.sticky-cta::before{left:50%;top:-21px;width:32px;height:19px;transform:translateX(-50%);
  border-radius:10px;background:rgba(46,32,36,.97);border:1px solid var(--line);
  box-shadow:0 4px 8px -2px rgba(0,0,0,.5)}
.sticky-cta::after{left:50%;top:-15px;width:7px;height:7px;
  transform:translateX(-50%) rotate(45deg);border-right:2px solid var(--dim);border-bottom:2px solid var(--dim)}
.screen.can-scroll .sticky-cta::before,.screen.can-scroll .sticky-cta::after{display:block;
  animation:moreBob 1.7s var(--ez) infinite}
@keyframes moreBob{0%,100%{opacity:.65}50%{opacity:1}}

/* 2026-08-22 오늘의 대결(④) — 의도적으로 .mode 와 «다른» 시각 동선 쓄다.
   S4(3연 동일 카드 AI티 지적, 아트스펙 대기) 와 «같은 문제를 되풀이하지 않기» 위해 명시적으로
   .mode 클래스를 재사용하지 않고 전용 클래스를 쓴다(그라디언트 테두리·스트릭 배지).
   성능 제약(Chief 2026-08-22) 준수: 캔버스가 아니라 DOM 단일 요소·반복 렌더 없음·새 backdrop-filter 없음. */
/* 오늘의 대결 카드 = 2행: [초상·제목/부제·연속일] + [출석표 7칸 스트립 + 캡션]. 규칙·지급은 game.js
   claimAttendance()/todaysFeatured() 무접촉 — 스트립은 그 값을 «읽어» 그린다. DOM 단일 카드, 반복 렌더 없음. */
.daily-bout{display:flex;flex-direction:column;gap:9px;width:100%;padding:11px 14px 10px;
  border-radius:var(--r-l);cursor:pointer;text-align:left;font-family:inherit;color:var(--txt);
  background:linear-gradient(160deg,rgba(255,201,74,.13),rgba(255,157,46,.05) 60%,rgba(255,201,74,.02));
  border:1px solid rgba(255,201,74,.32);
  transition:transform .18s var(--ez),border-color .2s,box-shadow .2s;margin-bottom:11px}
.daily-bout:hover{border-color:rgba(255,201,74,.55);transform:translateY(-2px)}
.daily-bout:active{transform:scale(.985)}
.daily-bout .row{display:flex;align-items:center;gap:12px;width:100%;min-height:46px}
.daily-bout .por{flex:0 0 auto;width:46px;height:46px;border-radius:15px;background:rgba(255,236,214,.06);
  display:flex;align-items:center;justify-content:center}
.daily-bout .por canvas{width:40px;height:40px}
.daily-bout .tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.daily-bout .eyebrow{font-size:.875rem;font-weight:800;letter-spacing:0;color:var(--txt);text-transform:none;order:0}
.daily-bout .sub{font-size:.8rem;color:var(--dim);line-height:1.35;margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.daily-bout .streak{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:44px;padding:3px 7px;border-radius:11px;background:rgba(255,201,74,.14);
  border:1px solid rgba(255,201,74,.38)}
.daily-bout .streak b{font-family:var(--display);font-size:1.25rem;font-weight:400;color:var(--gold);line-height:1;letter-spacing:.02em}
.daily-bout .streak span{font-size:.7rem;font-weight:700;color:var(--gold);letter-spacing:.02em;margin-top:1px}
.daily-bout.claimed .eyebrow{color:var(--gold)}
/* 출석표 스트립 — 7칸. 받은 날 = 체크, 오늘 = 금 테두리(미수령이면 맥동), 7번째 = 특급(크게). */
.att-strip{display:grid;grid-template-columns:repeat(6,1fr) 1.45fr;gap:5px;width:100%}
.att-cell{position:relative;display:flex;align-items:center;justify-content:center;min-height:30px;border-radius:9px;
  background:rgba(255,236,214,.05);background:color-mix(in srgb,var(--c) 14%,rgba(255,236,214,.03));border:1px solid rgba(255,236,214,.09);overflow:hidden}
.att-cell b{font-family:var(--display);font-size:.875rem;font-weight:400;letter-spacing:.04em;color:var(--dim2);line-height:1}
.att-cell.done{background:rgba(255,201,74,.16);border-color:rgba(255,201,74,.35)}
.att-cell.done b{color:var(--gold)}
.att-cell .chk{display:none;position:absolute;right:4px;top:3px;width:5px;height:9px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(40deg)}
.att-cell.done .chk{display:block}
.att-cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.att-cell.today.open{animation:attPulse 1.6s var(--ez) infinite}
.att-cell.today.open b{color:var(--txt)}
@keyframes attPulse{0%,100%{background:rgba(255,201,74,.10)}50%{background:rgba(255,201,74,.26)}}
.att-cell.peak{min-height:34px;border-radius:11px;background:linear-gradient(160deg,rgba(255,201,74,.12),rgba(255,157,46,.08))}
.att-cell.peak b{font-family:inherit;font-size:.75rem;font-weight:800;letter-spacing:.02em;color:var(--gold)}
.att-cell.peak.done{background:linear-gradient(160deg,#ffd35c,#ffb42e);border-color:transparent}
.att-cell.peak.done b{color:var(--ink-on-gold)}
.att-cell.peak.done .chk{border-color:var(--ink-on-gold)}
.att-cap{font-size:.75rem;color:var(--dim);line-height:1.3;margin-top:-2px}
.daily-bout.claimed .att-cap{color:var(--gold)}

/* mode cards */
.modes{display:flex;flex-direction:column;gap:11px;width:100%}
.mode{display:flex;align-items:center;gap:14px;width:100%;min-height:74px;padding:14px 16px;
  border-radius:var(--r-l);background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;
  transition:transform .18s var(--ez),background .2s,border-color .2s,box-shadow .2s;font-family:inherit;color:var(--txt)}
.mode:hover{background:var(--card2);border-color:rgba(255,236,214,.2);transform:translateY(-2px);
  box-shadow:0 12px 18px -8px rgba(0,0,0,.5)}
.mode:active{transform:scale(.985)}
.mode .badge{flex:0 0 auto;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;
  justify-content:center;font-size:1rem;font-weight:900;letter-spacing:-.02em}
.mode .badge{font-family:var(--display);font-weight:400;font-size:1rem;letter-spacing:.02em}
.mode .badge.a{background:linear-gradient(160deg,#ffd35c,#ff9d2e);color:var(--ink-on-gold)}
.mode .badge.v{background:linear-gradient(135deg,#ff5a5f 0 48%,#4a9eff 52% 100%);color:#0e0a0b}
.mode .badge.p{background:linear-gradient(160deg,#7fc0ff,#4a9eff);color:#0e1a2e}
.mode .tx{flex:1 1 auto;min-width:0}
.mode .tx h2{font-size:1.125rem;font-weight:800;margin-bottom:3px}
.mode .tx p{font-size:.8rem;color:var(--dim);line-height:1.45}
.mode .arw{flex:0 0 auto;color:var(--dim2);font-size:1.1rem;font-weight:900}

/* progress strip */
.prog{width:100%;display:flex;gap:8px}
.prog .cell{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);
  padding:10px 8px;text-align:center}
.prog .cell .k{font-size:.7rem;font-weight:700;letter-spacing:.04em;color:var(--dim2)}
.prog .cell .v{font-family:var(--display);font-size:1.4rem;font-weight:400;letter-spacing:.03em;margin-top:2px;line-height:1.1}
.prog .cell .v.gold{color:var(--gold)}

/* character grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px;width:100%}
.ccard{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-m);
  padding:8px 3px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:transform .16s var(--ez),border-color .2s,background .2s;font-family:inherit;color:var(--txt);min-height:104px}
.ccard:hover{transform:translateY(-3px);background:var(--card2)}
.ccard canvas{width:52px;height:52px;display:block}
.ccard .cn{font-size:.7rem;font-weight:800;text-align:center;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ccard.sel1{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,90,95,.2)}
.ccard.sel2{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,158,255,.2)}
.ccard.sel12{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,74,.22)}
.ccard .tagn{position:absolute;top:5px;left:5px;font-family:var(--display);font-size:.75rem;font-weight:400;padding:2px 6px 1px;
  border-radius:6px;letter-spacing:.06em;line-height:1.1}
/* 2026-08-22 AI티 S1(대비) — 흰 글자(#fff)가 red/blue 배지 위에서 3.05:1 / 2.75:1 로
   WCAG AA(4.5:1) 미달[실측, headless 렌더 + 실측 대비계산]. 코드베이스 기존 관례
   (.btn.primary·.mode .badge 전부 밝은 배지 위에 다크잉크 텍스트)를 따라 #20170a 로
   교체 — red 5.79:1 / blue 6.42:1[실측], 새 색 도입 없이 기존 토큰 재사용. */
.ccard .tagn.p1{background:var(--red);color:#0e0a0b}
.ccard .tagn.p2{background:var(--blue);color:#0e0a0b}
.ccard.lock{cursor:not-allowed}
.ccard.lock canvas{filter:grayscale(1) brightness(.42)}
.ccard.lock .cn{color:var(--dim2)}
.lockbadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-m);background:rgba(12,7,8,.58);color:var(--dim2)}
.lockbadge i{display:block;width:15px;height:12px;border-radius:2px;background:currentColor;position:relative}
.lockbadge i::before{content:"";position:absolute;left:3px;right:3px;bottom:11px;height:8px;
  border:2px solid currentColor;border-bottom:0;border-radius:6px 6px 0 0}

/* fighter detail card */
.detail{width:100%;display:flex;gap:12px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-l);padding:13px 15px}
.detail .por{flex:0 0 auto;width:76px;height:76px;border-radius:20px;background:rgba(255,236,214,.04);
  display:flex;align-items:center;justify-content:center}
.detail .por canvas{width:70px;height:70px}
.detail .info{flex:1 1 auto;min-width:0}
.detail .info .nm{font-size:1rem;font-weight:900;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail .info .ti{font-size:.75rem;color:var(--gold);font-weight:700;margin-top:2px;line-height:1.3}
.stats{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.stat{display:flex;align-items:center;gap:6px}
.stat .sl{flex:0 0 auto;font-size:.7rem;font-weight:700;color:var(--dim2);width:44px;
  letter-spacing:.02em}
.stat .st{flex:1 1 auto;height:5px;border-radius:3px;background:rgba(255,236,214,.09);overflow:hidden}
.stat .st i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#4a9eff,#ffc94a)}

/* segmented control */
.seg{display:flex;gap:6px;width:100%;background:rgba(255,236,214,.04);border:1px solid var(--line);
  border-radius:var(--r-m);padding:5px}
.seg button{flex:1 1 0;min-height:44px;border:0;border-radius:13px;background:transparent;color:var(--dim);
  font-size:.875rem;font-weight:800;cursor:pointer;transition:all .2s var(--ez);font-family:inherit;padding:6px 4px}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 3px 8px -2px rgba(0,0,0,.4)}
.seg button.on[data-d="0"]{color:var(--blue)} .seg button.on[data-d="1"]{color:var(--gold)}
.seg button.on[data-d="2"]{color:var(--red)}
.seg-lab{width:100%;display:flex;justify-content:space-between;align-items:baseline;padding:0 3px}
.seg-lab span{font-size:.8rem;font-weight:700;letter-spacing:.02em;color:var(--dim2)}
.seg-lab em{font-size:.75rem;font-style:normal;color:var(--dim)}

/* pick list (arena / rule) */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;width:100%}
.pick{min-height:46px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card);
  color:var(--dim);font-size:.75rem;font-weight:800;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:6px;padding:8px 6px;text-align:center;line-height:1.2;font-family:inherit;
  transition:all .18s var(--ez)}
.pick:hover{background:var(--card2);color:var(--txt)}
.pick.on{border-color:var(--gold);color:#ffe9a8;background:rgba(255,201,74,.10)}
.pick .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

/* VS screen */
.vswrap{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.vsside{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  animation:slideL .5s var(--ez) both}
.vsside.r{animation-name:slideR}
@keyframes slideL{from{opacity:0;transform:translateX(-38px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}
/* 트랙K 게이트4(2026-08-03): 390px 실기기에서 대진화면 세로 공간이 부족해
   사다리 8명 중 일부가 스크롤 없이 안 보인다는 지적(President 실기기).
   초상화·간격을 줄여 8명+승부버튼이 한 화면에 들어올 여지를 늘렸다.
   [가설 수정 — 실기기 확인 필요] */
.vsside canvas{width:min(22vw,86px);height:min(22vw,86px)}
.vsside .nm{font-size:clamp(.9rem,3.6vw,1.2rem);font-weight:900;text-align:center;line-height:1.2;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsside .ti{font-size:.7rem;color:var(--dim);text-align:center;line-height:1.3}
.vsbadge{font-size:.75rem;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:999px}
.vsbadge.p1{background:rgba(255,90,95,.16);color:#ff9297;border:1px solid rgba(255,90,95,.35)}
.vsbadge.p2{background:rgba(74,158,255,.16);color:#8cc4ff;border:1px solid rgba(74,158,255,.35)}
.vsmid{flex:0 0 auto;font-family:var(--display);font-size:2.2rem;font-size:clamp(1.9rem,8vw,2.8rem);font-weight:400;letter-spacing:.04em;
  color:var(--red);text-shadow:0 3px 0 #5a1113,0 8px 16px rgba(0,0,0,.5);animation:vspop .55s var(--ez) both .18s}
@keyframes vspop{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
.infoline{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%}

/* result */
.bigres{font-family:var(--display);font-size:3rem;font-size:clamp(2.4rem,12vw,4.2rem);font-weight:800;line-height:1;text-align:center;
  letter-spacing:.02em;animation:respop .5s var(--ez) both}
@keyframes respop{from{opacity:0;transform:scale(.6) translateY(16px)}to{opacity:1;transform:none}}
/* D1 수정(2026-08-14, Partner 승인 · 트랙③ 적용).
   [②실측] .bigres.dup{transform:rotate(180deg)} 이 «죽어 있었다» — .bigres 가 물려받은
   animation:respop 의 to{transform:none} 이 fill-mode both 로 «최종값을 덮어쓴다».
   측정값 700ms·1500ms 모두 matrix(1,0,0,1,0,0) = 무회전.
   → 「위쪽 플레이어를 위한 거울」이 정작 위쪽 플레이어에게 «거꾸로» 보였다.
   해법: dup 전용 키프레임. 회전을 «두 키프레임 모두»에 넣어 최종값이 rotate 를 유지한다.
   ⛔이 수정은 D2(글리프 극성 반전, game.js)와 «반드시 함께» 있어야 한다 —
     ⓐ만 적용하면 승자를 «반대로» 알려주게 되어 현행보다 나쁘다. */
@keyframes respopdup{from{opacity:0;transform:rotate(180deg) scale(.6) translateY(16px)}to{opacity:1;transform:rotate(180deg)}}
/* 2P verdict mirror. Hidden unless the match was versus. The winner's faction
   colour tints it and a side glyph is prepended in JS, so "who won" survives
   with no colour vision (WCAG 2.2 SC 1.4.1). */
.bigres.dup{display:none;transform:rotate(180deg);text-align:center;width:100%;
  border-radius:var(--r-m);padding:6px 10px;margin-bottom:2px;
  /* D1 수정: .bigres 가 물려준 respop 대신 회전을 «보존»하는 전용 키프레임을 쓴다.
     .bigres.dup 은 특정도 (0,2,0) 이라 .bigres (0,1,0) 의 animation 을 이긴다. */
  animation-name:respopdup}
#sc-result.duo .bigres.dup{display:block}
#sc-result.duo .bigres.dup.p1{background:rgba(255,90,95,.14)}
#sc-result.duo .bigres.dup.p2{background:rgba(74,158,255,.14)}
/* 2026-08-22 AI티 S8 — game.js 가 dup.textContent 앞에 이어붙이던 '▲ '/'▼ '
   를 CSS 삼각형으로 대체. ★극성은 원래 텍스트 글리프와 «동일»(D2 정정 유지) —
   .bigres.dup 자체가 rotate(180deg) 인 «박스 안의 의사요소»라 회전이 그대로
   같이 걸린다. 즉 여기서 모양만 바꿔도 회전 후 최종 시각 결과는 픽셀 단위로
   같다(w1=P1 승 -> ▲, 그 외 -> ▼, D2 결정 그대로). ⛔극성 반대로 바꾸지 마라 —
   D1(위 respopdup 키프레임)과 짝이 맞아야 승자 표시가 반대로 뒤집히지 않는다. */
.bigres.dup::before{content:'';display:inline-block;width:0;height:0;
  margin-right:8px;vertical-align:3px}
.bigres.dup.p1::before{border-left:7px solid transparent;border-right:7px solid transparent;
  border-bottom:11px solid var(--red)}
.bigres.dup.p2::before{border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:11px solid var(--blue)}
.bigres.win{color:var(--gold);text-shadow:0 4px 0 #8a4a00,0 12px 24px rgba(0,0,0,.55)}
.bigres.lose{color:#a89a8c;text-shadow:0 4px 0 #2a1c1e,0 12px 24px rgba(0,0,0,.55)}
.statlist{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);
  padding:6px 16px;animation:respop .5s var(--ez) both .12s}
.statrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
  border-bottom:1px solid rgba(255,236,214,.06);gap:10px;animation:rowIn .45s var(--ez) both}
.statrow:nth-child(1){animation-delay:.10s}.statrow:nth-child(2){animation-delay:.16s}.statrow:nth-child(3){animation-delay:.22s}
.statrow:nth-child(4){animation-delay:.28s}.statrow:nth-child(5){animation-delay:.34s}.statrow:nth-child(6){animation-delay:.40s}.statrow:nth-child(7){animation-delay:.46s}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.statrow:last-child{border-bottom:0}
.statrow .k{font-size:.8rem;color:var(--dim);font-weight:600}
.statrow .v{font-family:var(--display);font-size:1.25rem;font-weight:400;letter-spacing:.03em}
.statrow .v.gold{color:var(--gold)}
.unlockbox{width:100%;border-radius:var(--r-l);padding:13px 16px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(100deg,rgba(255,201,74,.14),rgba(255,157,46,.07));
  border:1px solid rgba(255,201,74,.34);animation:respop .5s var(--ez) both .2s}
.unlockbox canvas{width:44px;height:44px;flex:0 0 auto}
.unlockbox .t{font-size:.75rem;font-weight:700;letter-spacing:.02em;color:var(--gold)}
.unlockbox .n{font-size:1rem;font-weight:800;margin-top:2px}

/* ladder */
.ladder{width:100%;display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-s);
  background:var(--card);border:1px solid var(--line)}
.lrow.done{opacity:.55}
.lrow.cur{border-color:var(--gold);background:rgba(255,201,74,.08);box-shadow:0 0 0 2px rgba(255,201,74,.12)}
.lrow .no{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:rgba(255,236,214,.07);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:.8rem;font-weight:400;color:var(--dim)}
.lrow.cur .no{background:var(--gold);color:var(--ink-on-gold)}
.lrow.done .no{background:rgba(74,158,255,.18);color:var(--ok);position:relative}
/* 2026-08-22 preflight_ait.py 실코드 글리프 검출 대응 - '체크(V)' 유니코드
   글리프도 기기 폰트마다 모양이 다르다. game.js 는 이제 클리어된 스테이지의
   .no 를 빈 칸으로 두고, 여기서 CSS 만으로 체크 도형을 그린다(border 두 변을
   45도 회전시키는 표준 기법 - 폭풍/눈/타 프로젝트에서도 쓰는 검증된 방식). */
.lrow.done .no::after{content:'';position:absolute;left:50%;top:44%;width:5px;height:9px;
  margin-left:-3px;margin-top:-6px;border-right:2px solid var(--ok);border-bottom:2px solid var(--ok);
  transform:rotate(40deg)}
.lrow canvas{width:26px;height:26px;flex:0 0 auto}
/* the fighter name owns the row; the rule/arena meta is what gives way and truncates */
.lrow .ln{flex:1 1 auto;min-width:0;font-size:.8rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lr{flex:0 1 auto;min-width:0;max-width:48%;text-align:right;font-size:.7rem;font-weight:600;
  color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* help list */
.hlist{width:100%;display:flex;flex-direction:column;gap:9px}
.hitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 15px}
.hitem h4{font-size:.875rem;font-weight:900;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.hitem h4 .kbd{font-family:var(--display);font-size:.75rem;font-weight:400;letter-spacing:.06em;padding:3px 7px 2px;border-radius:6px;
  background:rgba(255,236,214,.09);border:1px solid var(--line);color:var(--txt)}
.hitem p{font-size:.8rem;color:var(--dim);line-height:1.55}
.k-red{color:var(--red);font-weight:800} .k-blue{color:var(--blue);font-weight:800}
.k-gold{color:var(--gold);font-weight:800}

/* lang */
#lang-switcher{position:fixed;top:calc(8px + var(--sa-top, env(safe-area-inset-top)));right:calc(8px + var(--sa-right, env(safe-area-inset-right)));
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;z-index:60;transition:opacity .25s ease}
#lang-switcher.off{opacity:0;pointer-events:none}
.lang-row{display:flex;gap:5px}
#lang-list{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:min(88vw,320px);
  background:rgba(22,15,17,.97);border:1px solid var(--line);border-radius:14px;padding:6px;
  box-shadow:0 8px 12px -6px rgba(0,0,0,.6)}
#lang-list.off{display:none}
/* 44x44 minimum touch target on every language / sound control */
.lang-btn{background:rgba(26,18,20,.9);border:1px solid var(--line);color:var(--dim2);font-size:.8rem;
  font-weight:800;padding:6px 8px;border-radius:12px;cursor:pointer;transition:all .16s var(--ez);
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  text-align:center;font-family:inherit}
.lang-btn:hover{color:var(--txt);background:rgba(52,36,40,.95)}
.lang-btn.active{color:var(--ink-on-gold);background:var(--gold);border-color:var(--gold)}
.lang-btn.muted{color:var(--dim2)}
.lang-btn{position:relative}
/* 2026-08-23 President 실기기 지적 대응 — clip-path 스피커 도형이 배율에 따라
   「•|」처럼 뭉개져 보였다(네온 게임과 동일 사고). clip-path 는 사각형 박스
   기준 % 좌표라 요소 크기가 바뀌면 폴리곤이 재계산되지 않고 찌그러진다.
   ⇒ «인라인 SVG path» 로 교체 — SVG 는 자체 viewBox 좌표계를 가진 벡터라
   어느 배율에서도 정확하게 렌더되고 폰트 의존성도 없다(원래 목적 그대로
   달성). 아이콘은 game.js 가 #btn-mute 안에 <svg> 로 직접 그려 넣는다
   (아래 규칙은 그 svg 내부 path 의 표시/숨김만 담당).
   관례: 켜짐 = 스피커+음파 두 개(.ic-wave) / 꺼짐 = 스피커+사선(.ic-x). */
#btn-mute svg{width:19px;height:19px;display:block;overflow:visible;flex:0 0 auto}
#btn-mute .ic-x{display:none}
#btn-mute.muted .ic-wave{display:none}
#btn-mute.muted .ic-x{display:block}
/* #sel-turn 의 턴 전환 아이콘 — 원래 텍스트 뒤에 이어붙이던 '⇄' 대체.
   ★렌더 확인(headless 스크린샷) 후 정정: 아래 polygon 은 실제로는 셰브런
   (>) «단일» 화살표로 그려진다(bidirectional 아님) — 그래도 "누르면 다음
   선수로 전환" 의미는 여전히 명확하게 전달된다(다음/전환 화살표는 흔한 UI
   관례). 요구사항의 핵심(폰트 의존 글리프 제거, 기기 간 동일 렌더)은
   그대로 충족한다 — 주석이 실제 모양과 다르면 안 되므로 여기서 정정한다. */
#sel-turn.has-swap-icon{padding-right:13px;position:relative}
#sel-turn.has-swap-icon::after{content:'';position:absolute;right:0;top:50%;
  width:8px;height:8px;margin-top:-4px;
  background:currentColor;
  clip-path:polygon(0% 0%,100% 50%,0% 100%,0% 65%,55% 50%,0% 35%)}

/* 2026-08-22 개인정보처리방침 링크 — Partner 지시(사고: 방침문서 5종, 앱 안엔
   길이 없었음). #lang-switcher 바로 아래 같은 우측정렬로 둔다(형제 요소,
   부모 안에 두면 game.js initLang() 의 sw.innerHTML='' 가 지운다 - 실측).
   대비 실측(WCAG 2.2 AA 4.5:1 기준): var(--dim2)(#8a97ac) on rgba(20,25,34,.82)
   = 5.96:1, PASS. 터치타깃: Web WCAG 2.2 AA 는 24px 기준(44px 일괄 통일은
   ui-ux-pro-max 실측으로 정정된 값) - 여기 36px 로 여유있게 잡는다.
   플레이 영역·#ad-slots(경기장 배너)와 비인접 - 배너는 하단 전체폭
   position:absolute, 이 링크는 상단 우측 고정. showScreen() 이 이 요소도
   #lang-switcher 와 같은 조건으로 .off 를 토글한다(public/game/*.js). */
#privacy-link{position:fixed;top:calc(58px + var(--sa-top, env(safe-area-inset-top)));
  right:calc(8px + var(--sa-right, env(safe-area-inset-right)));z-index:60;
  display:inline-flex;align-items:center;justify-content:center;
  min-height:36px;padding:6px 10px;border-radius:11px;
  background:rgba(26,18,20,.9);border:1px solid var(--line);color:var(--dim2);
  font-size:.7rem;font-weight:700;text-decoration:none;white-space:nowrap;
  transition:opacity .25s ease,color .16s var(--ez),background .16s var(--ez)}
#privacy-link:hover{color:var(--txt);background:rgba(52,36,40,.95)}
#privacy-link.off{opacity:0;pointer-events:none}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(22px + var(--sa-bottom, env(safe-area-inset-bottom)));transform:translate(-50%,14px);
  background:rgba(30,20,23,.97);border:1px solid var(--line);border-radius:14px;padding:11px 18px;
  font-size:.8rem;font-weight:800;color:var(--txt);z-index:70;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ez),transform .3s var(--ez);box-shadow:0 8px 12px -6px rgba(0,0,0,.6);max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.spacer{height:2px}
@media (min-width:430px){h1.title{font-size:2.9rem}}
@media (max-width:420px){
  .panel{gap:11px}
  .detail{padding:11px 12px;gap:10px}
  .detail .por{width:64px;height:64px;border-radius:17px}
  .detail .por canvas{width:58px;height:58px}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px}
  .ccard{min-height:94px}.ccard canvas{width:46px;height:46px}
  #hud{padding:6px 10px 4px}
  .hud-mid{min-width:110px}.hud-timer{width:110px}
}
/* short viewports: claw back vertical space so the selection lists need as little
   scrolling as possible. 트랙K 게이트4(2026-08-03): 700px 문턱은 "작은 창 높이"만
   봤지 safe-area(노치+홈인디케이터)로 실제 줄어드는 유효 높이는 고려 안 했다.
   iPhone 논리해상도(844px)는 창 높이는 크지만 safe-area+SDK 헤더까지 빼면 실사용
   가능 높이가 700px대 기기와 비슷해진다 — 그래서 이 압축 레이아웃이 안 걸렸다
   (President 실기기에서 대진화면 8명이 안 들어온 원인 중 하나). 문턱을 900px로
   올려 표준 iPhone 세로 화면을 포함시킨다. [가설 수정 — 실기기 확인 필요] */
@media (max-height:900px){
  .screen{padding-top:calc(54px + var(--sa-top, env(safe-area-inset-top)))}
  .panel{gap:9px}
  .detail{padding:10px 12px;gap:10px}
  .detail .por{width:56px;height:56px;border-radius:16px}
  .detail .por canvas{width:52px;height:52px}
  .detail .info .nm{font-size:1rem}
  .ccard{min-height:86px;padding:6px 3px 5px}
